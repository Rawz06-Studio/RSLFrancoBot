spring.application.name=RSLFrancoBot

# Discord Configuration (from environment)
app.discord.token=${DISCORD_TOKEN}

# Seed Generation API (external) - from environment
app.seed.api.domain=${SEED_API_DOMAIN:https://api.randomizer.example.com}
app.seed.api.timeout.seconds=30
app.seed.api.mode=http

# Logging configuration for production
logging.level.root=INFO
logging.level.fr.rawz06.rslfrancobot=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
